<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foto a Video IA | Sin Censura y Gratis</title>
    <style>
        /* --- ESTILOS CSS --- */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 900px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 10px;
        }

        p.subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 30px;
        }

        /* --- SECCIÓN DE INPUTS --- */
        .input-section {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
            align-items: center;
            padding: 20px;
            border: 1px solid #ecf0f1;
            border-radius: 10px;
        }

        .input-group {
            flex: 1;
            min-width: 200px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #34495e;
        }

        input[type="file"], select, button {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #bdc3c7;
            font-size: 1rem;
            box-sizing: border-box;
        }

        button {
            background-color: #3498db;
            color: white;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s ease;
            font-weight: bold;
            margin-top: 15px; /* Asegura espacio debajo de los selects */
        }

        button:hover {
            background-color: #2980b9;
        }

        /* --- SECCIÓN DE PREVIEW Y RESULTADOS --- */
        .output-section {
            text-align: center;
            padding: 30px;
            border: 2px dashed #bdc3c7;
            border-radius: 10px;
        }

        #videoPreview {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 20px auto;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        #loadingSpinner {
            display: none; /* Oculto por defecto */
            font-size: 2rem;
            animation: spin 1.5s linear infinite;
            color: #3498db;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        #downloadLink {
            display: inline-block;
            margin-top: 20px;
            padding: 15px 30px;
            background-color: #2ecc71;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 1.1rem;
            transition: background-color 0.3s ease;
        }

        #downloadLink:hover {
            background-color: #27ae60;
        }

    </style>
</head>
<body>

    <div class="container">
        <h1>🎬 Foto a Video IA</h1>
        <p class="subtitle">Convierte tu imagen estática en un clip dinámico, sin censura y totalmente gratis.</p>

        <!-- SECCIÓN DE INPUTS -->
        <div class="input-section">
            <div class="input-group" style="flex: 2;">
                <label for="photoInput">1. Sube tu Foto (JPG/PNG)</label>
                <input type="file" id="photoInput" accept=".jpg, .jpeg, .png" required>
            </div>

            <div class="input-group">
                <label for="durationSelect">2. Duración Máxima</label>
                <select id="durationSelect">
                    <option value="15">15 segundos (Estándar)</option>
                    <option value="30" selected>30 segundos</option>
                    <option value="60">60 segundos (Máx. Permitido)</option>
                </select>
            </div>

             <div class="input-group">
                <label for="styleSelect">3. Estilo de Animación</label>
                <select id="styleSelect">
                    <option value="cinematic">Cine/Dramático</option>
                    <option value="vibrant" selected>Vibrante (Colorido)</option>
                    <option value="slow_motion">Movimiento Lento</option>
                    <option value="panoramic">Panorámica (Zoom lento)</option>
                </select>
            </div>
        </div>

        <!-- BOTÓN DE ACCIÓN -->
        <button id="generateButton" onclick="generateVideo()">🚀 Generar Video Ahora</button>

        <!-- SECCIÓN DE OUTPUTS -->
        <div class="output-section">
            <h2>Resultado</h2>
            <div id="loadingSpinner">🔄</div> 
            <video id="videoPreview" controls autoplay muted loop style="display: none;"></video>
            <p id="statusMessage">Espera a subir una foto y presionar el botón para empezar.</p>
            <a id="downloadLink" href="#" download="mi_video_ia.mp4" style="display: none;">Descargar Video (MP4)</a>
        </div>

    </div>

    <!-- --- JAVASCRIPT LÓGICA --- -->
    <script>
        const photoInput = document.getElementById('photoInput');
        const durationSelect = document.getElementById('durationSelect');
        const styleSelect = document.getElementById('styleSelect');
        const generateButton = document.getElementById('generateButton');
        const videoPreview = document.getElementById('videoPreview');
        const statusMessage = document.getElementById('statusMessage');
        const downloadLink = document.getElementById('downloadLink');
        const loadingSpinner = document.getElementById('loadingSpinner');

        function setLoading(isLoading) {
            if (isLoading) {
                generateButton.disabled = true;
                generateButton.textContent = 'Generando... Por favor espera';
                videoPreview.style.display = 'none';
                downloadLink.style.display = 'none';
                loadingSpinner.style.display = 'block';
            } else {
                generateButton.disabled = false;
                generateButton.textContent = '🚀 Generar Video Ahora';
                loadingSpinner.style.display = 'none';
            }
        }

        async function generateVideo() {
            const file = photoInput.files[0];
            if (!file) {
                alert("Por favor, selecciona una foto primero.");
                return;
            }

            const duration = durationSelect.value; // En segundos
            const style = styleSelect.value;
            
            setLoading(true);
            statusMessage.textContent = `Procesando... Foto seleccionada (${file.name}), Duración: ${duration}s, Estilo: ${style}...`;

            // --- SIMULACIÓN DE LLAMADA A API (EL MOTOR REAL) ---
            // En un sitio real, aquí harías un 'fetch()' a un servidor backend.
            try {
                console.log(`Iniciando generación con parámetros: Duración=${duration}, Estilo=${style}`);

                // 1. Crear una URL de datos para la foto (Base64)
                const reader = new FileReader();
                reader.readAsDataURL(file);

                await new Promise((resolve, reject) => {
                    reader.onload = function() {
                        // *** AQUÍ ES DONDE LLAMARÍAS A TU SERVIDOR REAL ***
                        // Ejemplo: const response = await fetch('https://tuapi-gratis.com/generate', { method: 'POST', body: JSON.stringify({ image_data: reader.result, duration: duration, style: style }) });
                        
                        // SIMULACIÓN DE RESPUESTA EXITOSA (Simulamos que la IA tardó 5 segundos en renderizar)
                        setTimeout(() => {
                            console.log("API Response simulada recibida.");
                            resolve();

                            // --- CREAR UN VIDEO MOCKUP PARA DEMOSTRACIÓN ---
                            // Para hacer esto funcional sin un backend, necesitamos crear una URL de video temporal (Blob URL).
                            // En un entorno real, la API te devolvería una URL como: "https://api.ai-video.com/render_xyz123.mp4"

                            const mockVideoURL = createMockVideo(file); 
                            
                            // Mostrar el video y preparar el enlace de descarga
                            videoPreview.src = mockVideoURL;
                            videoPreview.style.display = 'block';
                            downloadLink.href = mockVideoURL;
                            downloadLink.style.display = 'inline-block';

                        }, 5000); // Simula un tiempo de renderizado de 5 segundos
                    };
                    reader.onerror = function(error) {
                        reject("Error al leer el archivo.");
                    };
                });


            } catch (error) {
                statusMessage.textContent = `❌ ERROR: ${error}`;
                console.error(error);
            } finally {
                setLoading(false); // Detener la carga
            }
        }

        // --- FUNCIÓN AUXILIAR PARA CREAR UN VIDEO MOCKUP EN EL NAVEGADOR (SIN BACKEND) ---
        function createMockVideo(file) {
             return new Promise((resolve) => {
                const img = new Image();
                img.onload = function() {
                    // Usamos Canvas para dibujar la imagen y luego exportarla como video usando MediaRecorder API
                    const canvas = document.createElement('canvas');
                    canvas.width = 1280; // Resolución HD simulada
                    canvas.height = 720;

                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, 1280, 720);

                    // Crear un stream de video desde el Canvas
                    const stream = canvas.captureStream(30); // 30 FPS
                    const recorder = new MediaRecorder(stream, { mimeType: 'video/webm; codecs=vp9' });
                    const chunks = [];

                    recorder.ondataavailable = (e) => {
                        chunks.push(e.data);
                    };

                    recorder.onstop = () => {
                        // Convertir los chunks a un Blob y luego a una URL de objeto
                        const blob = new Blob(chunks, { type: 'video/webm' });
                        resolve(URL.createObjectURL(blob));
                    };

                    // Iniciar el grabador por la duración seleccionada (30 segundos en este mock)
                    recorder.start();
                    setTimeout(() => {
                        recorder.stop();
                    }, 30000); // Detiene después de 30 segundos (simulando la selección predeterminada)

                };
                img.src = file.URL.createObjectURL(file);
            });
        }
    </script>

</body>
</html>
